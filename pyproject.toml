[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macsec"
version = "0.1.0"
description = "Deterministic, read-only macOS security and health posture audit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MacSec contributors"}]
keywords = ["macos", "security", "audit", "health", "posture"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]

[project.scripts]
macsec = "macsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
